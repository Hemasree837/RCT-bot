# Application Configuration
spring.application.name=resume-chatbot
spring.config.import=optional:application-local.properties

# Server Port
server.port=8085

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Telegram Bot Configuration
# Bot token from @BotFather. Set via TELEGRAM_BOT_TOKEN environment variable.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:ResumeCareerAssistantBot}
telegram.bot.polling-enabled=${TELEGRAM_POLLING_ENABLED:true}
telegram.bot.polling-timeout-seconds=30

# AI Service Configuration
# Provider: mock (deterministic fallback) or gemini / openai
ai.provider=${AI_PROVIDER:mock}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}

# ATS-like Compatibility Score Factor Weights (must sum to 1.0)
ats.weights.skill=0.50
ats.weights.keyword=0.20
ats.weights.experience=0.15
ats.weights.education=0.10
ats.weights.completeness=0.05
