# Sample Configuration File - Copy to application-local.properties or set Environment Variables
# NEVER commit real tokens or credentials into version control!

# Server Configuration
server.port=8080

# Telegram Bot Configuration
# Obtain your bot token by messaging @BotFather on Telegram
# In production, pass as environment variable: export TELEGRAM_BOT_TOKEN="your-telegram-token"
telegram.bot.token=YOUR_TELEGRAM_BOT_TOKEN_HERE
telegram.bot.username=YOUR_TELEGRAM_BOT_USERNAME_HERE
telegram.bot.polling-enabled=true
telegram.bot.polling-timeout-seconds=30

# AI Configuration (Optional: application operates in deterministic rule-based mode if empty)
# In production, pass as environment variable: export AI_API_KEY="your-ai-api-key"
ai.provider=mock
ai.api-key=YOUR_AI_API_KEY_HERE
ai.model=gemini-1.5-flash

# ATS-like Compatibility Score Factor Weights (sum to 1.0)
ats.weights.skill=0.50
ats.weights.keyword=0.20
ats.weights.experience=0.15
ats.weights.education=0.10
ats.weights.completeness=0.05
